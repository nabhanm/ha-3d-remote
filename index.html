<!doctype html>
<!-- HA 3D Remote: the app is this one file + config.js (your home) + three.module.min.js and three-addons/ (the 3D library). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HA 3D Remote</title>
<link rel="manifest" href="manifest.json?v=5" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0b0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ---------- design tokens ---------- */
:root{
  --bg:#0a0b0e; --card:#15171c; --card-2:#1e2128; --line:rgba(255,255,255,.075); --text:#f3f4f6; --muted:#8f96a3;
  --on:#2dd4bf; --acc-ink:#03201c; --on-ink:#03201c; --on-soft:rgba(3,32,28,.16); --track:#2a2e36;
  --plug-off:linear-gradient(135deg,#8f2434,#d8434f); --plug-on:linear-gradient(135deg,#17804a,#35c873);
  --danger:#ff7a6b; --ok:#5fd08a;
  --lift:inset 0 1px 0 rgba(255,255,255,.04); --glass:rgba(21,23,28,.72); --glow:rgba(45,212,191,.11);
  --r:22px; --r-sm:14px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f4f7; --card:#ffffff; --card-2:#f0f1f4; --line:rgba(16,24,40,.08); --text:#14161a; --muted:#646a75;
    --on:#0b7268; --acc-ink:#ffffff; --on-ink:#ffffff; --on-soft:rgba(255,255,255,.28); --track:#e3e5ea;
    --plug-off:linear-gradient(135deg,#c93645,#ef6a6f); --plug-on:linear-gradient(135deg,#1f9a59,#4bd685);
    --danger:#c8402f; --ok:#2e9b5b;
    --lift:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05); --glass:rgba(255,255,255,.75); --glow:rgba(11,114,104,.08);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;color:var(--text);background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%) no-repeat,var(--bg);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 88px);
  min-height:100dvh;overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;text-align:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
:where(.tap,.scene,.pill,.btn,.alert,.navb,.key,.planback,.signout,.tg,.azbtn,.fxb,.sw):focus-visible{outline:2px solid var(--on);outline-offset:3px}

/* ---------- header: what is on right now ---------- */
.top{margin-bottom:12px}
.toprow{display:flex;align-items:center;gap:8px;min-height:36px}
.toprow .brand{flex:1}
.brand{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wx{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 8px;border-radius:10px;background:var(--card-2);font-size:13px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.wx svg{width:17px;height:17px;flex:none;color:var(--muted)}
.wx small{font-size:12px;font-weight:550;color:var(--muted)}
@media (max-width:399px){.wx .cond{display:none}}
.wx{transition:transform .15s var(--ease)}.wx:active{transform:scale(.95)}
/* weather page */
.wxback{height:36px;padding:0 12px 0 8px;border-radius:11px;background:var(--card-2);font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:4px}
.wxback svg{width:18px;height:18px}
#weather .azcol{grid-template-columns:minmax(0,1fr)}
#weather .azcard,#weather .azhero{min-width:0}
.wxnow{display:flex;align-items:center;gap:14px}
.wxnow svg{width:54px;height:54px;flex:none}
.wxnow .azbig{margin-top:0}
.wxfacts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;opacity:.9}
.wxhours{display:flex;gap:4px;overflow-x:auto;padding:4px 6px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wxhours::-webkit-scrollbar{display:none}
.wxh{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px;background:var(--card-2);font-size:13px;font-variant-numeric:tabular-nums}
.wxh small{color:var(--muted);font-size:11.5px;font-weight:600}
.wxh svg{width:22px;height:22px;color:var(--muted)}
.wxh b{font-weight:680}
.wxh i{font-style:normal;font-size:10.5px;color:#4ea3ff;min-height:13px}
.wxd{display:grid;grid-template-columns:minmax(0,1fr) 26px auto;align-items:center;gap:12px;min-height:54px;padding:4px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.wxd + .wxd{border-top:1px solid var(--line)}
.wxd svg{width:24px;height:24px;color:var(--muted)}
.wxd .dn b{display:block;font-weight:650}.wxd .dn small{color:var(--muted);font-size:12.5px}
.wxd .hl{font-weight:680;white-space:nowrap}.wxd .hl span{color:var(--muted);font-weight:550}
.signout{height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);background:var(--card-2);transition:transform .15s var(--ease)}
.signout:active{transform:scale(.95)}
/* connection light in front of the name: green = connected, flashing amber = (re)connecting, red = can't reach home */
.brand{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#f5a524;box-shadow:0 0 0 3px rgba(245,165,36,.2);animation:pulse 1s ease-in-out infinite}
body[data-conn="on"] .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);animation:none}
body[data-conn="down"] .dot{background:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%,transparent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top h1{font-size:26px;font-weight:720;letter-spacing:-.025em;line-height:1.15;margin-top:4px;text-wrap:balance}

.alert:active{transform:scale(.98)}

/* section headings */
.label{display:flex;align-items:center;justify-content:space-between;min-height:36px;margin:22px 2px 10px}
.label h2{font-size:18px;font-weight:680;letter-spacing:-.01em}
.pill{height:34px;padding:0 14px;border-radius:11px;background:var(--card-2);font-size:13px;font-weight:650;color:var(--text);transition:transform .15s var(--ease)}
.pill:active{transform:scale(.95)}

/* ---------- scenes: the All on/off button first, then the scenes as icons ---------- */
.scenes{display:grid;grid-template-columns:1.6fr repeat(5,1fr);gap:8px;max-width:560px;margin:0 auto}
.scene{
  display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);color:var(--on);
  transition:transform .15s var(--ease),background .25s,border-color .25s,color .25s;
}
.scene svg{width:24px;height:24px;flex:none}
.scene:active{transform:scale(.92)}
.scene.fired{background:var(--on);border-color:var(--on);color:var(--on-ink)}
/* All on/off: red while every light is off, green while any is on (same colours as the smart plugs) */
.scene.master{color:#fff;border-color:transparent;background:var(--plug-off);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.scene.master[data-on="1"]{background:var(--plug-on)}

/* ---------- tiles: the whole tile is the button; lit = on ---------- */
.rooms{display:grid;grid-template-columns:1fr;column-gap:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Rooms page: one tile per room (tap = that room's page) */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.rtile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:112px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);color:var(--text);text-align:left;transition:transform .15s var(--ease)}
.rtile:active{transform:scale(.97)}
.rtile svg{width:26px;height:26px;margin-bottom:auto;color:var(--muted)}
.rtile b{font-size:16px;font-weight:680}
.rtile small{font-size:13px;color:var(--muted)}
.rtile[data-on="1"] svg,.rtile[data-on="1"] small{color:var(--on)}
.roomback{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 6px;margin:16px 0 -10px;border-radius:11px;font-size:14px;font-weight:650;color:var(--muted)}
.roomback svg{width:20px;height:20px}
.roomback:active{transform:scale(.95)}
.rooms.single>section:not(.detail) .roomback,#plan:not([hidden])~.rooms .roomback{display:none}
.tile{
  display:flex;flex-direction:column;min-height:128px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);
  color:var(--text);transition:background .3s,border-color .3s,color .3s,transform .15s var(--ease),opacity .3s;overflow:hidden;
}
.tile.wide{grid-column:span 2}
.tile.short{min-height:110px}
.tile[data-on="1"]{background:var(--tbg,var(--on));border-color:transparent;color:var(--on-ink)}
.tile.plug{--on-ink:#fff;--on-soft:rgba(255,255,255,.28);border-color:transparent;color:#fff}
.tile.plug[data-on="0"]{background:var(--plug-off)}
.tile.plug[data-on="1"]{--tbg:var(--plug-on)}
.tile.plug .ico svg,.tile.plug .badge{color:#fff}
.tile.plug .ico svg{background:rgba(255,255,255,.18)}
.tile.plug .tstate{color:#fff;opacity:.85}
.tile[data-gone="1"]{opacity:.5}
.tile:has(.tap:active){transform:scale(.97)}
.tap{flex:1;width:100%;padding:14px 14px 14px 16px;display:flex;flex-direction:column;align-items:flex-start;border-radius:var(--r)}
.tile[data-on="1"] .tap:focus-visible{outline-color:var(--on-ink);outline-offset:-5px}
.ico{display:flex;align-items:center;justify-content:space-between;width:100%}
.ico svg{width:40px;height:40px;padding:9px;border-radius:13px;background:var(--card-2);color:var(--text);transition:color .3s,background .3s}
.tile[data-on="1"] .ico svg{color:var(--on-ink);background:var(--on-soft)}
.badge{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.tile[data-on="1"] .badge{color:var(--on-ink)}
.tname{font-size:15.5px;font-weight:650;margin-top:12px;line-height:1.2;letter-spacing:-.005em}
.tstate{font-size:13.5px;color:var(--muted);margin-top:2px}
.tile[data-on="1"] .tstate{color:var(--on-ink);opacity:.78}

/* sliders (brightness, scene speed, volume) */
.lvl{
  -webkit-appearance:none;appearance:none;display:none;flex:none;height:30px;margin:0 14px 14px;border-radius:15px;
  cursor:pointer;touch-action:pan-y;background:linear-gradient(to right,var(--on-ink) var(--p,0%),var(--on-soft) var(--p,0%));
}
.tile[data-on="1"] .lvl{display:block}
.lvl::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.06);border:0}
.lvl::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);border:0}
.lvl::-moz-range-track{background:transparent}
.lvl:focus-visible{outline:2px solid var(--on-ink);outline-offset:2px}

/* colours: on a light's tile inside its room page, while the light is on */
.swatches{display:none;flex-wrap:wrap;gap:10px;padding:2px 14px 16px}
.detail .tile[data-on="1"] .swatches{display:flex}
.sw{width:38px;height:38px;border-radius:50%;background:var(--c);border:2px solid var(--on-soft);transition:transform .15s var(--ease),box-shadow .2s}
.sw:active{transform:scale(.88)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--on-ink);transform:scale(1.06)}
.swgap{width:1px;align-self:stretch;background:var(--on-soft);margin:4px 2px}
/* light scenes (WiZ effects): same place as the colours */
.fx{display:none;flex-wrap:wrap;gap:8px;padding:0 14px 16px}
.detail .tile[data-on="1"] .fx{display:flex}
.fxb{height:38px;padding:0 14px;border-radius:11px;background:var(--on-soft);font-size:13.5px;font-weight:620;color:var(--on-ink);transition:transform .15s var(--ease),box-shadow .2s,background .2s}
.fxb:active{transform:scale(.94)}
.fxb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--on-ink)}
/* room card: brightness + scenes for the whole room (only on the room's own page) */
.roomcard{display:none;--on-ink:var(--text);--on-soft:var(--card-2);background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);border-radius:var(--r);padding:16px 14px 6px;margin-bottom:10px}
.detail .roomcard{display:block}
.roomcard .rowname,.detail .roomcard .rowname{display:flex;justify-content:space-between;padding:0 2px 10px;opacity:1;color:var(--muted)}
.roomcard .lvl{display:block;margin:0 0 18px;width:100%;background:linear-gradient(to right,var(--on) var(--p,0%),var(--track) var(--p,0%))}
.roomcard .fx{display:flex;padding:0 0 12px}
.roomcard .fxb[aria-pressed="true"]{background:var(--on);color:var(--acc-ink);box-shadow:none}
.roomcard .fx.more{display:none}
.roomcard.meters{padding-bottom:8px}
.roomcard .meter{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 2px;border-top:1px solid var(--line)}
.roomcard .meter span{color:var(--muted);font-size:14px}
.roomcard .meter b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.roomcard.open .fx.more{display:flex}
.roomcard .morebtn{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rowname{display:none;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7;padding:0 16px 8px}
.detail .tile[data-on="1"] .rowname{display:block}

/* geyser countdown bar */
.timer{display:none;flex:none;margin:0 16px 16px;height:6px;border-radius:3px;background:var(--on-soft);overflow:hidden}
.timer i{display:block;height:100%;width:var(--left,0%);background:var(--on-ink);border-radius:3px;transition:width 1s linear}
.tile[data-on="1"] .timer.run{display:block}

/* ---------- pages: a frosted bar of icons along the bottom on a phone, a side panel on a tablet ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;background:var(--glass);border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  padding:6px max(4px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 6px) max(4px, env(safe-area-inset-left));
}
.nav .brand{display:none}
.navb{
  flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:54px;border-radius:14px;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;text-align:center;
  transition:color .2s,transform .15s var(--ease);
}
.navb svg{width:24px;height:24px;flex:none;transition:transform .2s var(--ease)}
.navb .full{display:none}
.navb:active{transform:scale(.9)}
.navb:focus-visible{outline-offset:-3px}
.navb[aria-current="page"]{color:var(--on);font-weight:750}
.navb[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
.navb .n{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--on);color:var(--acc-ink);font-size:10.5px;font-weight:750;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--bg)}
.navb .n:empty{display:none}
/* the "meniscus" bar (phone only): the open page rises out of the bar as a glowing bead, sitting in a smooth notch
   cut into the bar. The bead slides (and can be dragged) between pages; JS draws the notch as a clip-path each frame. */
.navskin,.navrim,.bead{display:none}
@media (max-width:999px){
  body{padding-bottom:calc(env(safe-area-inset-bottom) + 108px)}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 106px)}
  .nav.liquid{background:transparent;border-top:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding-top:10px;touch-action:none}
  .nav.liquid .navb{touch-action:none}   /* fingers on the bar belong to the bead, not to page scrolling (else the browser cancels a drag) */
  .nav.liquid .navskin{display:block;position:absolute;inset:0;z-index:0;background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%)}
  .nav.liquid .navrim{display:block;position:absolute;left:0;top:0;width:100%;height:60px;z-index:0;overflow:visible;pointer-events:none}
  .navrim path{fill:none;stroke:var(--line);stroke-width:1}
  .nav.liquid .bead{
    display:flex;align-items:center;justify-content:center;position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;z-index:1;
    background:var(--card-2);color:var(--on);border:1px solid var(--line);
    box-shadow:0 4px 12px -4px rgba(0,0,0,.35);   /* quiet: neutral disc, only the icon in the accent colour */
    touch-action:none;cursor:grab;will-change:transform;
  }
  .nav.liquid .bead.held{cursor:grabbing}
  .bead svg{width:20px;height:20px}
  .nav.liquid .navb{z-index:2;justify-content:flex-end;padding-bottom:3px}
  .nav.liquid .navb svg{margin:auto 0;transition:opacity .2s,transform .2s var(--ease)}
  .nav.liquid .navb[aria-current="page"] svg{opacity:0;transform:none}
  .nav.liquid .navb[aria-current="page"] .n{top:-26px;left:calc(50% + 10px)}
}

/* ---------- TV remote ---------- */
.tvstate{font-size:15px;color:var(--muted);margin:0 2px 14px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px}
.key{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:72px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);font-size:12.5px;font-weight:620;color:var(--muted);text-align:center;
  transition:transform .12s var(--ease),background .15s,color .15s;
}
.key svg{width:26px;height:26px;color:var(--text)}
.key:active{transform:scale(.93);background:var(--on);color:var(--on-ink);border-color:var(--on)}
.key:active svg{color:var(--on-ink)}
.key.app{min-height:54px;font-size:14.5px;color:var(--text)}
.key.span3{grid-column:span 3;flex-direction:row;gap:10px;font-size:15px;color:var(--text)}
.tvcols{display:grid;grid-template-columns:1fr;gap:0 28px}

/* ---------- cards (Controls and Weather pages) ---------- */
.azcols{display:grid;grid-template-columns:1fr;gap:10px 22px;align-items:start}
.azcol{display:grid;gap:10px}
.azhero{border-radius:var(--r);padding:18px 18px 16px;color:var(--on-ink);background:linear-gradient(135deg,var(--on),color-mix(in srgb,var(--on) 60%,#2f8cff));box-shadow:0 10px 30px color-mix(in srgb,var(--on) 25%,transparent)}
.azk{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.azbig{font-size:30px;font-weight:750;letter-spacing:-.025em;margin-top:4px;line-height:1.15}
.azsub{font-size:15px;opacity:.85;margin-top:3px;min-height:20px}
.azbar{height:6px;border-radius:3px;background:var(--on-soft);margin-top:14px;overflow:hidden}
.azbar i{display:block;height:100%;width:var(--p,0%);background:var(--on-ink);border-radius:3px;transition:width 1s}
.azcard{background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);border-radius:var(--r);padding:4px 6px 6px}
.azh{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.azrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:12px;min-height:60px;padding:6px 10px;border-radius:16px;transition:background .25s}
.azrow.nt{grid-template-columns:40px minmax(0,1fr) auto}
.azrow[data-next="1"]{background:color-mix(in srgb,var(--on) 14%,transparent)}
.azi{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--card-2);color:var(--text);transition:background .25s,color .25s}
.azi svg{width:22px;height:22px}
.azrow[data-next="1"] .azi{background:var(--on);color:var(--acc-ink)}
.azn b{display:block;font-size:15.5px;font-weight:650}
.azn small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.azn small:empty{display:none}
.azrow[data-next="1"] .azn small{color:var(--on);font-weight:650}
.azt{font-size:15.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.azrow[data-past="1"] .azn b,.azrow[data-past="1"] .azt{color:var(--muted)}
.azrow[data-off="1"] .azt{text-decoration:line-through;color:var(--muted)}
.azval{font-size:15px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.azcard .lvl{display:block;margin:0 10px 14px;width:calc(100% - 20px);background:linear-gradient(to right,var(--on) var(--p,0%),var(--track) var(--p,0%))}
.azcard .lvl:focus-visible{outline-color:var(--on)}
/* on/off switch */
.tg{position:relative;width:51px;height:31px;border-radius:16px;background:var(--track);flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .22s var(--ease)}
.tg[aria-checked="true"]{background:var(--on)}
.tg[aria-checked="true"]::after{transform:translateX(20px)}
.tg:disabled{opacity:.4}
.azbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.azbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--lift);font-size:15px;font-weight:650;text-align:center;transition:transform .15s var(--ease),background .2s,color .2s,border-color .2s}
.azbtn svg{width:22px;height:22px;color:var(--on);flex:none}
.azbtn:active{transform:scale(.96)}
.azbtn.armed{background:var(--on);border-color:var(--on);color:var(--acc-ink)}
.azbtn.armed svg{color:var(--acc-ink)}
.azcard .azbtn{width:calc(100% - 12px);margin:4px 6px 6px;background:var(--card-2);border-color:transparent;box-shadow:none}
/* shopping list */
.lsadd{display:flex;gap:8px;padding:8px 6px 6px}
.lsadd input{flex:1;min-width:0;height:50px;border-radius:15px;border:1px solid var(--line);background:var(--card-2);color:var(--text);font:inherit;font-size:16px;padding:0 14px}
.lsadd input::placeholder{color:var(--muted)}
.lsadd input:focus{outline:2px solid var(--on);outline-offset:1px}
.lsadd button{flex:none;width:50px;height:50px;border-radius:15px;background:var(--on);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease)}
.lsadd button:active,.lsrow .lsck:active{transform:scale(.92)}
.lsadd button svg{width:24px;height:24px}
/* Controls page extras: speakers, ad blocking */
#panelX .azcols{margin-top:10px}
.spb:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.spb{width:44px;height:44px;border-radius:50%;background:var(--card-2);color:var(--on);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease)}
.spb svg{width:20px;height:20px}
.spb:active{transform:scale(.92)}
.azcard .lvl:disabled{opacity:.4}
.sleepin{padding:0 0 12px}
.sleepin input{-moz-appearance:textfield}
.sleepin input::-webkit-inner-spin-button,.sleepin input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.lsrow{display:flex;align-items:center;gap:4px;min-height:56px;padding:0 4px 0 6px;border-radius:16px}
.lsck{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:54px;text-align:left;font-size:16px;font-weight:550;padding:4px 4px;transition:transform .15s var(--ease)}
.lsck .box{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:var(--acc-ink);transition:background .2s,border-color .2s}
.lsck .box svg{width:16px;height:16px;opacity:0}
.lsck .nm{overflow-wrap:anywhere}
.lst{display:flex;flex-direction:column;min-width:0}
.lsby{font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
.lsby:empty{display:none}
.lsrow[data-done="1"] .box{background:var(--on);border-color:var(--on)}
.lsrow[data-done="1"] .box svg{opacity:1}
.lsrow[data-done="1"] .nm{color:var(--muted);text-decoration:line-through}
.lsx{flex:none;width:44px;height:44px;border-radius:14px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.lsx svg{width:18px;height:18px}
#list .azcard+.azcard{margin-top:10px}
.lsempty{color:var(--muted);font-size:15px;padding:10px 12px 14px}
.lshead{display:flex;align-items:center;justify-content:space-between}
.lsclear{font-size:13.5px;font-weight:650;color:var(--on);padding:10px 12px;border-radius:12px}
.azcard .azbtn.armed{background:var(--on)}

/* ---------- buttons, full-screen messages, toast ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);font-size:16px;font-weight:650;transition:transform .15s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--on);border-color:var(--on);color:var(--on-ink)}
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;z-index:5}
.screen img{width:88px;height:88px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.screen h2{font-size:24px;letter-spacing:-.02em}
.screen p{color:var(--muted);max-width:320px}
.screen .btn{max-width:280px;margin-top:10px}
[hidden]{display:none!important}
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translate(-50%,16px);
  background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);
  opacity:0;transition:opacity .2s,transform .25s var(--ease);pointer-events:none;max-width:90vw;z-index:9;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- layouts ---------- */
.rooms.single{grid-template-columns:1fr}
.detail .tiles{grid-template-columns:1fr}
.detail .tile.wide{grid-column:auto}
@media (min-width:700px){
  body{padding-left:28px;padding-right:28px}
  .scenes{gap:10px}
  .rooms{grid-template-columns:1fr 1fr}
  .rooms.single{grid-template-columns:1fr}
  .detail .tiles{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .tvcols{grid-template-columns:auto 1fr}
  .azcols{grid-template-columns:1fr 1fr}
}
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
  body{padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 24px)}
  .nav{position:sticky;top:18px;left:auto;right:auto;bottom:auto;flex-direction:column;gap:4px;padding:0;border-top:0;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav .brand{display:flex;margin:8px 14px 16px}
  .navb{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;height:48px;padding:0 14px;font-size:15px;font-weight:600;border-radius:14px;text-align:left}
  .navb svg{width:20px;height:20px}
  .navb .full{display:inline}
  .navb .short{display:none}
  .navb:active{transform:scale(.97)}
  .navb[aria-current="page"]{background:var(--card);color:var(--text);box-shadow:var(--lift);font-weight:650}
  .navb[aria-current="page"] svg{color:var(--on);transform:none}
  .navb .n{position:static;margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;font-size:12px;box-shadow:none}
  .top{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:12px}
  .top .brand{display:none}
  .top h1{margin-top:0}
}
@media (min-width:1280px){
  .rooms{grid-template-columns:repeat(3,1fr)}
  .rooms.single{grid-template-columns:1fr}
}

/* ---------- the 3D home ---------- */
.plan3d{position:relative;margin:0 -12px 8px}
#planCanvas{display:block;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.plamps{position:absolute;inset:0;pointer-events:none}
/* lamp buttons: see-through tap areas lying on the lamps, TV and geyser */
.plamp{position:absolute;width:var(--lamp,44px);height:var(--lamp,44px);transform:translate(-50%,-50%);border-radius:50%;pointer-events:auto;background:transparent;transition:background .2s}
.plamp:active{background:rgba(255,255,255,.18)}
.plamp:focus-visible{outline:3px solid var(--on);outline-offset:3px}
.planback{position:absolute;left:12px;top:4px;height:38px;padding:0 14px 0 10px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);font-size:14px;font-weight:650;display:flex;align-items:center;gap:6px}
.planback[hidden]{display:none}
.planlock{position:absolute;right:12px;top:4px;z-index:2;width:42px;height:42px;border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),color .2s}
.planlock svg{width:21px;height:21px}
.planlock[aria-pressed="true"]{color:var(--on);border-color:var(--on)}
.planlock:active{transform:scale(.92)}
.planback:active{transform:scale(.95)}
.planhint{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 12px}
.planhint:empty{display:none}

/* a page sliding in after a sideways swipe */
main.fromR{animation:fromR .24s var(--ease)}
main.fromL{animation:fromL .24s var(--ease)}
@keyframes fromR{from{transform:translateX(32px);opacity:.2}}
@keyframes fromL{from{transform:translateX(-32px);opacity:.2}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap shell" id="app" hidden>
  <nav class="nav liquid" id="nav" aria-label="Rooms"><p class="brand"><span class="dot"></span>HA 3D Remote</p><div class="navskin" id="navSkin"></div><svg class="navrim" id="navRim" aria-hidden="true"><path/></svg><span class="bead" id="bead" aria-hidden="true"></span></nav>
  <main>
    <div class="top">
      <div class="toprow">
        <p class="brand"><span class="dot"></span>3D Remote<span class="sr" id="connText" role="status">Connecting</span></p>
        <button class="wx" id="wx" hidden></button>
        <button class="signout" id="signOut">Sign out</button>
      </div>
      <h1 id="summary">&nbsp;</h1>
    </div>

    <section id="plan" hidden><div class="plan3d" id="plan3d"><canvas id="planCanvas" role="img" aria-label="3D floor plan of the home"></canvas><div class="plamps" id="planLamps"></div><button class="planlock" id="planLock" aria-pressed="false" aria-label="Unlock turning the home"></button><button class="planback" id="planBack" hidden>&#8592; Whole home</button></div><p class="planhint" id="planHint"></p></section>
    <div class="scenes" id="scenes"></div>
    <div class="rgrid" id="roomGrid" hidden></div>
    <div class="rooms" id="rooms"></div>
    <section id="panelX" hidden></section>
    <section id="tv" hidden></section>
    <section id="list" hidden></section>
    <section id="weather" hidden></section>

  </main>
</div>

<div class="screen" id="login" hidden>
  <img src="icon-192.png" alt="">
  <h2>HA 3D Remote</h2>
  <p>Sign in once with your Home Assistant username and password. This device will stay signed in.</p>
  <button class="btn primary" id="loginBtn">Sign in</button>
</div>

<div class="screen" id="unreachable" hidden>
  <img src="icon-192.png" alt="">
  <h2>Can't reach home</h2>
  <p>Check that this device can reach Home Assistant, then tap Try again.</p>
  <button class="btn primary" id="retryBtn">Try again</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script>
"use strict";
/* All house-specific settings (rooms, lights, floor plan, TV, ...) live in config.js. */

/* ---------- icons ---------- */
const ICONS = {
  tick: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',

  dinner: '<path d="M6 2v6a3 3 0 0 0 6 0V2M9 2v20M18 22V2c-2 2-3 5-3 9h3"/>',

  unlock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.6-1.7"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  ceiling: '<path d="M12 2v5M5 15a7 7 0 0 1 14 0zM10 18.5a2 2 0 0 0 4 0"/>',
  lamp: '<path d="M8.5 3h7l3 8h-13zM12 11v10M8 21h8"/>',
  pendant: '<path d="M12 2v4M12 6c4 0 6.5 3 6.5 6.5S16 19 12 19s-6.500-3-6.500-6.500S8 6 12 6zM9.500 6.600c-1.500 3.500-1.500 8 0 11.800M14.500 6.600c1.500 3.500 1.500 8 0 11.800M10.500 22h3"/>',
  sparkle: '<path d="M11 3l1.900 5.100L18 10l-5.100 1.900L11 17l-1.900-5.100L4 10l5.100-1.900zM19 15v5M16.500 17.500h5"/>',
  water: '<path d="M12 3s6.500 6.500 6.500 11.500a6.500 6.500 0 0 1-13 0C5.500 9.500 12 3 12 3zM9 15a3 3 0 0 0 3 3"/>',
  bag: '<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M4 12h16"/>',
  mute: '<path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6M21 9l-5 6"/>',
  house: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  bed: '<path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6M3 15h18M3 18v2M21 18v2M6 10V7a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v3"/>',
  tv: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
  grid: '<rect x="4" y="4" width="6.500" height="6.500" rx="1.500"/><rect x="13.500" y="4" width="6.500" height="6.500" rx="1.500"/><rect x="4" y="13.500" width="6.500" height="6.500" rx="1.500"/><rect x="13.500" y="13.500" width="6.500" height="6.500" rx="1.500"/>',
  plan: '<path d="M12 3l8 4.500v9L12 21l-8-4.500v-9zM12 12l8-4.500M12 12v9M12 12L4 7.500"/>',
  up: '<path d="M6 15l6-6 6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', left: '<path d="M15 6l-6 6 6 6"/>', right: '<path d="M9 6l6 6-6 6"/>',
  ok: '<circle cx="12" cy="12" r="5"/>',
  back: '<path d="M10 6l-6 6 6 6M4 12h11a5 5 0 0 1 0 10h-1"/>',
  playpause: '<path d="M4 6l8 6-8 6zM15 6v12M20 6v12"/>',
  voldown: '<path d="M11 5 6 9H3v6h3l5 4zM16 12h6"/>',
  volup: '<path d="M11 5 6 9H3v6h3l5 4zM16 12h6M19 9v6"/>',
  game: '<path d="M7 8h10a5 5 0 0 1 5 5v1a3 3 0 0 1-5.500 1.700L15.500 14h-7l-1 1.700A3 3 0 0 1 2 14v-1a5 5 0 0 1 5-5zM7 10.500v3M5.500 12h3M16 11.500h.01M18 13h.01"/>',
  sunrise: '<path d="M17 18a5 5 0 0 0-10 0M12 3v6M9 6l3-3 3 3M3 18h18M4.500 13.500l1.500 1M19.500 13.500l-1.500 1M7 22h10"/>',
  sunset: '<path d="M17 18a5 5 0 0 0-10 0M12 3v6M9 6l3 3 3-3M3 18h18M4.500 13.500l1.500 1M19.500 13.500l-1.500 1M7 22h10"/>',
  cloudsun: '<path d="M8 2.500V4M3.500 7.500H2M4.600 4.600l1 1M12.500 9a4.500 4.500 0 0 0-8.300 2.800"/><path d="M8 20h9a3.500 3.500 0 0 0 .3-7A5 5 0 0 0 7.600 14 3 3 0 0 0 8 20z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  play: '<path d="M7 4.500l12 7.500-12 7.500z"/>',
  speaker: '<rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="12" cy="14" r="3"/><path d="M12 7.5h.01"/>',
  shield: '<path d="M12 3 5 6v5c0 4.5 3 8.4 7 10 4-1.6 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  cart: '<path d="M3 4h2.500l2.200 10.500a1.500 1.500 0 0 0 1.500 1.200h8.300a1.500 1.500 0 0 0 1.500-1.100L21 8H6.300"/><circle cx="10" cy="20" r="1.400"/><circle cx="17" cy="20" r="1.400"/>',
  cloud: '<path d="M7 19h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 10.500 4.300 4.300 0 0 0 7 19z"/>',
  rain: '<path d="M7 15h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 6.500 4.300 4.300 0 0 0 7 15zM8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
  bolt: '<path d="M7 14h10a4 4 0 0 0 .4-8A6 6 0 0 0 6 5.500 4.300 4.300 0 0 0 7 14zM12.500 14l-2 4h3l-2 4"/>',
  fog: '<path d="M4 9h16M3 13h18M5 17h14M8 21h8"/>',
  wind: '<path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M5 12.500l4.500 4.500L19 7.500"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
};
const svg = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const show = (id, on) => { $(id).hidden = !on; };
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} };

/* ---------- sign-in (Home Assistant's own login, no passwords stored here) ---------- */
const CLIENT_ID = location.origin + "/";
const REDIRECT = location.origin + location.pathname;
const TK = "homeRemoteTokens";
let tokens = null;
try { tokens = JSON.parse(localStorage.getItem(TK)); } catch (e) {}
const saveTokens = () => { try { tokens ? localStorage.setItem(TK, JSON.stringify(tokens)) : localStorage.removeItem(TK); } catch (e) {} };

async function tokenRequest(params) {
  const r = await fetch("/auth/token", { method: "POST", body: new URLSearchParams({ ...params, client_id: CLIENT_ID }) });
  if (!r.ok) { const e = new Error("auth"); e.status = r.status; throw e; }
  return r.json();
}
function startLogin() {
  const state = Math.random().toString(36).slice(2);
  try { localStorage.setItem("hrState", state); } catch (e) {}
  location.href = "/auth/authorize?response_type=code&client_id=" + encodeURIComponent(CLIENT_ID) +
    "&redirect_uri=" + encodeURIComponent(REDIRECT) + "&state=" + state;
}
async function finishLogin(code) {
  const j = await tokenRequest({ grant_type: "authorization_code", code });
  tokens = { access: j.access_token, refresh: j.refresh_token, expires: Date.now() + j.expires_in * 1000 };
  saveTokens();
}
async function freshAccessToken() {
  if (tokens.expires - Date.now() > 60000) return tokens.access;
  const j = await tokenRequest({ grant_type: "refresh_token", refresh_token: tokens.refresh });
  tokens.access = j.access_token; tokens.expires = Date.now() + j.expires_in * 1000; saveTokens();
  return tokens.access;
}
function signedOut() {
  tokens = null; saveTokens(); stopSocket();
  show("app", false); show("unreachable", false); show("login", true);
}

/* ---------- live connection to Home Assistant ---------- */
let wxToday = null, wxTimer = 0, wxDaily = [], wxHourly = [];   // today's high/low, asked for when connecting and then every hour
let listSub = 0, listItems = null, listLocal = null;   // shopping list: items from Home Assistant, plus changes not yet confirmed
let ws = null, ready = false, msgId = 0, retry = 0, retryTimer = null, failures = 0, pongTimer = null;
const states = {};          // entity_id -> state object
const pending = {};         // entity_id -> { on: bool, until: ms }  (instant feedback while HA catches up)
const waiting = {};         // message id -> what it was

function setStatus(s) {
  document.body.dataset.conn = s;          // the light in front of the app name (no text on screen)
  $("connText").textContent = s === "on" ? "Connected" : s === "down" ? "Can't reach home" : "Connecting";
}
function stopSocket() {
  clearTimeout(retryTimer); clearTimeout(pongTimer);

}

  clearTimeout(retryTimer);

}
async function connect() {

    return scheduleReconnect();                                   // network problem
  }

    if (m.type === "auth_required") sock.send(JSON.stringify({ type: "auth", access_token: access }));
    else if (m.type === "auth_invalid") { tokens.expires = 0; saveTokens(); scheduleReconnect(); }

      sock.send(JSON.stringify({ id: ++msgId, type: "subscribe_events", event_type: "state_changed" }));
      listSub = ++msgId; waiting[listSub] = "listsub";   // the shopping list's items (its state only says how many are left)
      sock.send(JSON.stringify({ id: listSub, type: "todo/item/subscribe", entity_id: LIST.id }));
      wxForecast();
      waiting[++msgId] = "me";                            // who is signed in → "added by" on shopping-list items
      sock.send(JSON.stringify({ id: msgId, type: "auth/current_user" }));
      waiting[++msgId] = "states";
      sock.send(JSON.stringify({ id: msgId, type: "get_states" }));
    }
    else if (m.type === "event" && m.id === listSub && m.event && m.event.items) { listItems = m.event.items; listLocal = null; paintList(); }
    else if (m.type === "event" && m.event && m.event.event_type === "state_changed") {
      const d = m.event.data;
      if (d.new_state) states[d.entity_id] = d.new_state; else delete states[d.entity_id];
      delete pending[d.entity_id];

    }
    else if (m.type === "pong") { clearTimeout(pongTimer); }

      const what = waiting[m.id]; delete waiting[m.id];
      if (what === "me" && m.success) ui.me = String(m.result.name || "").trim().split(/\s+/)[0];
      else if (what === "states" && m.success) {
        for (const s of m.result) states[s.entity_id] = s;
        ready = true; retry = 0; failures = 0; setStatus("on");
        show("unreachable", false); show("login", false); show("app", true);
        draw();

        const f = m.success && m.result && m.result.response && m.result.response[WEATHER.id], list = f && f.forecast || [];
        if (what === "forecast:daily") { wxDaily = list; wxToday = list.find(d => new Date(d.datetime).toDateString() === new Date().toDateString()) || null; }
        else wxHourly = list;
        draw(); paintWxPage();
      } else if (what === "listsub") {
        if (!m.success) { listItems = []; paintList(); toast("Couldn't load the shopping list"); }
      } else if (!m.success && what) {

}
function call(domain, service, data) {
  if (!ready || !ws || ws.readyState !== 1) { toast("Not connected yet"); return false; }
  waiting[++msgId] = "call";
  ws.send(JSON.stringify({ id: msgId, type: "call_service", domain, service, service_data: data }));
  return true;
}
// When the phone/tablet wakes up the connection may be dead without us knowing: check it.
function checkAlive() {
  if (!tokens) return;
  if (!ws || ws.readyState > 1) { retry = 0; return connect(); }
  if (ws.readyState === 1 && ready) {
    try { ws.send(JSON.stringify({ id: ++msgId, type: "ping" })); } catch (e) {}
    clearTimeout(pongTimer);
    pongTimer = setTimeout(() => { retry = 0; connect(); }, 3000);
  }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkAlive(); });
window.addEventListener("online", checkAlive);
window.addEventListener("pageshow", e => { if (e.persisted) checkAlive(); });

/* ---------- reading state ---------- */
const gone = id => !states[id] || states[id].state === "unavailable" || states[id].state === "unknown";
function isOn(id) {
  const p = pending[id];
  if (p && Date.now() < p.until) return p.on;
  return !!states[id] && states[id].state === "on";
}
function pct(id) {
  const b = states[id] && states[id].attributes.brightness;
  return b ? Math.max(1, Math.round(b / 2.55)) : null;
}
function setOn(ids, on, alsoShow) {
  buzz();
  if (!call("homeassistant", on ? "turn_on" : "turn_off", { entity_id: ids })) return;
  for (const id of ids.concat(alsoShow || [])) pending[id] = { on, until: Date.now() + 6000 };
  draw();
}

/* ---------- building the screen (once) ---------- */
const ui = { tiles: [], rooms: [], nav: [], dragging: null, view: "home" };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const switchable = r => r.things.filter(t => t.id).map(t => t.id);

function build() {
  const m = ui.master = el("button", "scene master", svg("power") + "<span></span>");
  m.onclick = () => {
    const ids = ui.tiles.filter(u => u.t.id && u.t.light !== false).map(u => u.t.id), on = !ids.some(isOn);
    setOn(ids, on); toast(on ? "All lights on" : "All lights off");

  for (const s of SCENES) {
    const b = el("button", "scene", svg(s.icon));

    b.onclick = () => {

      toast(s.name);
      b.classList.add("fired"); setTimeout(() => b.classList.remove("fired"), 900);
    };
    $("scenes").append(b);
  }
  addNav("plan", "Home", "house");
  addNav("home", "Rooms", "grid");
  for (const r of ROOMS) {
    const sec = el("section"), head = el("div", "label"), h = el("h2");
    h.textContent = r.name; head.append(h);
    const ids = switchable(r);
    let pill = null;
    if (ids.length > 1 && r.all) {

      pill.onclick = () => setOn([r.all], !ids.some(isOn), ids);

    }
    const grid = el("div", "tiles");
    for (const t of r.things) grid.append(buildTile(t, r.things.length === 1));
    const room = { r, ids, pill, sec, key: r.name, chips: [] };
    if (!r.homeOnly) {                                           // "‹ Rooms" at the top of a room's own page
      const back = el("button", "roomback", svg("left") + "<span>Rooms</span>");
      back.onclick = () => { buzz(); setView("home"); }; sec.append(back);
      const rt = room.rtile = el("button", "rtile", svg(r.icon || "house") + "<b></b><small></small>");
      rt.children[1].textContent = r.name; rt.onclick = () => { buzz(); setView(r.name); };
      $("roomGrid").append(rt);

    sec.append(head);
    if (r.scenes && r.target) sec.append(buildRoomCard(room));
    if (r.sleep) sec.append(buildSleepCard(room));

  buildPlan();
  ui.tvCount = addNav("tv", "TV", "tv");
  buildTv();
  ui.lsCount = addNav("list", "Shopping list", "cart", "List");
  buildList();
  buildExtras();
  addNav("panel", "Control panel", "sliders", "Controls");

// The card at the top of a room's page: brightness for the whole room and its scenes
function buildRoomCard(room) {
  const r = room.r, card = el("div", "roomcard");
  if (r.dimAll) {
    const n = el("div", "rowname", "<span>Brightness · " + (r.targetName || "all") + "</span><span></span>");
    const range = room.range = el("input", "lvl"); range.type = "range"; range.min = 1; range.max = 100; range.value = 50;
    range.setAttribute("aria-label", r.name + " brightness"); room.pct = n.lastChild;
    let sendTimer = null, last = 0;
    const send = () => { last = Date.now(); if (call("light", "turn_on", { entity_id: r.target, brightness_pct: +range.value })) for (const id of room.ids.concat(r.target)) if (id.startsWith("light.")) pending[id] = { on: true, until: Date.now() + 6000 }; };
    range.oninput = () => {
      ui.dragging = range; range.style.setProperty("--p", range.value + "%"); room.pct.textContent = range.value + "%";
      clearTimeout(sendTimer); sendTimer = setTimeout(send, Math.max(0, 350 - (Date.now() - last)));
    };

  }

  const lights = room.lights = r.target === r.all ? room.ids.filter(id => id.startsWith("light.")) : [r.target];
  const fx = el("div", "fx");
  room.chip = name => {
    const b = el("button", "fxb"); b.textContent = name; b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      buzz();
      if (!call("light", "turn_on", { entity_id: r.target, effect: name })) return;
      room.picked = { fx: name, until: Date.now() + 6000 };
      setHint(lights, { fx: name });
      for (const id of lights.concat(r.target)) pending[id] = { on: true, until: Date.now() + 6000 };   // a scene also switches the lights on
      draw();
    };
    room.chips.push([name, b]);

  };
  for (const name of r.scenes) fx.append(room.chip(name));

  const tog = el("button", "fxb morebtn"); tog.textContent = "All scenes";
  tog.onclick = () => { buzz(); tog.textContent = card.classList.toggle("open") ? "Fewer scenes" : "All scenes"; };
  fx.append(tog);
  room.more = el("div", "fx more");
  // scene speed: only shown while the bulb offers it (moving scenes)
  room.speedIds = lights.map(id => id.replace("light.", "number.") + "_effect_speed");
  const sp = room.speedRow = el("div", "", "<div class=\"rowname\"><span>Scene speed</span><span></span></div>"); sp.hidden = true;
  const sr = room.speed = el("input", "lvl"); sr.type = "range"; sr.min = 10; sr.max = 200; sr.step = 5; sr.value = 100;
  sr.setAttribute("aria-label", r.name + " scene speed");
  const showSpeed = () => { sr.style.setProperty("--p", ((sr.value - 10) / 190 * 100) + "%"); sp.querySelector(".rowname").lastChild.textContent = sr.value < 70 ? "Slow" : sr.value > 130 ? "Fast" : "Normal"; };
  room.showSpeed = showSpeed;
  sr.oninput = () => { ui.dragging = sr; showSpeed(); };
  sr.onchange = () => {
    buzz();
    for (const id of room.speedIds) if (states[id] && !isNaN(parseFloat(states[id].state))) call("number", "set_value", { entity_id: id, value: +sr.value });
    setTimeout(() => { if (ui.dragging === sr) ui.dragging = null; draw(); }, 4000);
  };

}
// Read-only numbers (e.g. the geyser's kWh) in a card at the top of a room's own page
function buildMeterCard(room) {

  n.firstChild.textContent = room.r.meterTitle || "Readings"; card.append(n);

// The bead on the phone's bottom bar. It springs to the open page's tab, stretches while it moves (the shoulder behind it
// draws out, the one ahead tightens) and can be dragged along the bar, snapping to the nearest tab when let go.
// The notch: a bowl of radius s around the bead, joined to the bar's top edge by two round shoulders (radius r) that
// touch the top edge and the bowl, so each shoulder centre sits sqrt((s+r)^2 - (r-BY)^2) to the side of the bead.
const bead = (() => {
  const nav = $("nav"), skin = $("navSkin"), rim = $("navRim").firstChild, b = $("bead");
  const RB = 20, BY = 6, S = 12, s = RB + 5;          // bead radius, bead centre (px below the bar's top), shoulder radius, bowl radius
  const phone = matchMedia("(max-width:999px)"), calm = matchMedia("(prefers-reduced-motion: reduce)");
  let x = null, v = 0, target = 0, key = null, raf = 0, last = 0, drag = null, dragged = false;
  const centre = k => {
    const e = ui.nav.find(n => n[0] === k); if (!e) return null;
    const r = e[1].getBoundingClientRect(); return r.left - nav.getBoundingClientRect().left + r.width / 2;
  };
  const f = n => n.toFixed(1);
  function draw() {
    const W = nav.clientWidth, H = nav.clientHeight, q = Math.max(-1, Math.min(1, v / 1400)), m = Math.abs(q);
    const side = (k, dir) => {                          // one shoulder: where it leaves the top edge, and where it meets the bowl
      const r = Math.max(4, S * k), cx = x + dir * Math.sqrt((s + r) ** 2 - (r - BY) ** 2), d = s + r;
      return [r, cx, cx + (x - cx) * r / d, r + (BY - r) * r / d];
    };
    const [rL, lx, t1x, t1y] = side(1 + .06 * m + .4 * q, -1), [rR, rx, t2x, t2y] = side(1 + .06 * m - .4 * q, 1);
    const top = `M0,0 L${f(lx)},0 A${f(rL)},${f(rL)} 0 0 1 ${f(t1x)},${f(t1y)} A${s},${s} 0 ${t1y < BY ? 1 : 0} 0 ${f(t2x)},${f(t2y)} A${f(rR)},${f(rR)} 0 0 1 ${f(rx)},0 L${W},0`;
    rim.setAttribute("d", top);
    skin.style.clipPath = `path("${top} L${W},${H} L0,${H} Z")`;
    b.style.transform = `translate(${f(x - RB)}px,${BY - RB}px) scale(${(1 + .14 * m).toFixed(3)},${(1 - .1 * m).toFixed(3)})`;
  }
  function step(t) {
    const dt = Math.min(.032, (t - last) / 1000 || .016); last = t;
    if (drag) v *= .85;                                 // held still → the stretch relaxes
    else { const k = 230, c = 2 * Math.sqrt(k) * .72; v += (k * (target - x) - c * v) * dt; x += v * dt; }   // a slightly wobbly spring
    draw();
    if (drag || Math.abs(target - x) > .3 || Math.abs(v) > 3) raf = requestAnimationFrame(step);
    else { x = target; v = 0; draw(); raf = 0; }
  }
  const run = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); } };
  function to(k) {
    key = k;
    const e = ui.nav.find(n => n[0] === k);
    if (e) b.innerHTML = e[1].querySelector("svg").outerHTML;
    if (!phone.matches) return;
    const c = centre(k); if (c == null) return;
    target = c;
    if (x === null || calm.matches || !nav.clientWidth) { x = c; v = 0; draw(); return; }
    run();
  }
  // the bar changes size (page first shown, phone turned, window resized) → put the bead straight on its tab
  new ResizeObserver(() => { if (phone.matches && key) { const c = centre(key); if (c != null) { x = target = c; v = 0; draw(); } } }).observe(nav);
  nav.addEventListener("pointerdown", e => {
    if (!phone.matches || x === null) return;
    const r = nav.getBoundingClientRect(), px = e.clientX - r.left;
    if (Math.hypot(px - x, e.clientY - r.top - BY) > RB + 8) return;   // only a press on the bead itself
    drag = { off: px - x, x0: e.clientX, t: e.timeStamp }; dragged = false;
    nav.setPointerCapture(e.pointerId); b.classList.add("held"); e.preventDefault(); run();
  });
  nav.addEventListener("pointermove", e => {
    if (!drag) return;
    if (Math.abs(e.clientX - drag.x0) > 6) dragged = true;
    const cs = ui.nav.map(n => centre(n[0])), px = e.clientX - nav.getBoundingClientRect().left;
    const nx = Math.max(cs[0], Math.min(cs[cs.length - 1], px - drag.off)), dt = Math.max(1, e.timeStamp - drag.t);
    v = v * .5 + (nx - x) / dt * 500; drag.t = e.timeStamp; x = nx;
  });
  const drop = () => {
    if (!drag) return; drag = null; b.classList.remove("held");
    if (!dragged) { buzz(); setView(key); return; }      // a plain tap on the bead = tapping that tab (e.g. back to all rooms)
    let best = null, bd = 1e9;
    for (const [k] of ui.nav) { const d = Math.abs(centre(k) - x); if (d < bd) { bd = d; best = k; } }
    buzz(); setView(best);
  };
  nav.addEventListener("pointerup", drop); nav.addEventListener("pointercancel", drop);
  nav.addEventListener("click", e => { if (dragged) { dragged = false; e.stopPropagation(); e.preventDefault(); } }, true);
  return { to };
})();
// One entry in the room list. Returns the little "how many are on" bubble.

  b.children[1].textContent = name; b.children[2].textContent = short || name;

// Home shows everything; a room shows only that room (with colour choices); TV shows the TV remote.
// "plan" with a room = the floor plan zoomed in on that room, with its controls underneath.
function setView(key, room) {
  const zoom = key === "plan" && ui.view === "plan";      // moving around inside the floor plan
  ui.view = key; ui.planRoom = key === "plan" ? room || null : null;
  const pr = ui.planRoom, prKey = pr && pr.page;
  const navKey = ui.rooms.some(x => x.key === key) ? "home" : key;   // inside a room → the Rooms tab stays lit
  for (const [k, b] of ui.nav) {
    if (k === navKey) { b.setAttribute("aria-current", "page"); }
    else b.removeAttribute("aria-current");
  }
  bead.to(navKey);
  $("scenes").hidden = !(key === "home" || (key === "plan" && !pr));
  $("tv").hidden = key !== "tv";
  $("list").hidden = key !== "list";
  $("weather").hidden = key !== "weather";
  if (key === "weather") { paintWxPage(); wxForecast(); }   // fresh forecast each time the page opens
  paintWeather();                                          // the weather sits in the top line of the Home page only
  $("plan").hidden = key !== "plan";
  $("rooms").hidden = key === "tv" || key === "list" || key === "weather" || (key === "plan" && !prKey);
  const list = key === "home" || key === "panel";          // Rooms / Controls = normal 2-column tiles, not a room's own page
  $("rooms").classList.toggle("single", !list);
  $("roomGrid").hidden = key !== "home";
  $("panelX").hidden = key !== "panel";
  for (const x of ui.rooms) {
    const on = key === "panel" ? !!x.r.homeOnly : key === "home" ? false : x.key === (key === "plan" ? prKey : key);
    x.sec.hidden = !on; x.sec.classList.toggle("detail", on && !list);
  }
  if (key === "plan") {
    $("planBack").hidden = !pr;
    $("planHint").textContent = !pr ? (ui.planFree ? "Drag to turn. Tap the lock to go back to the main-door view." : "Tap a lamp, the TV or a room.") : prKey ? "" : pr.name + ": no smart devices here yet.";
    fitPlan(zoom); draw();
  }

}

function buildTile(t, alone) {
  const tile = el("div", "tile" + (alone || t.wide ? " wide" : "") + (t.short ? " short" : "") + (t.plug ? " plug" : ""));
  const tap = el("button", "tap", `<span class="ico">${svg(t.icon)}<span class="badge"></span></span><span class="tname"></span><span class="tstate"></span>`);
  tap.querySelector(".tname").textContent = t.name;
  const u = { t, tile, tap, badge: tap.querySelector(".badge"), state: tap.querySelector(".tstate"), sw: [], fx: [] };
  tile.append(tap);
  if (t.press) {                                     // a plain button (runs a script)
    u.state.textContent = t.hint || "";
    tap.onclick = () => { buzz(); if (call("script", "turn_on", { entity_id: t.press })) toast(t.done || "Done"); };
    return tile;
  }
  tap.setAttribute("aria-pressed", "false");
  tap.onclick = () => setOn([t.id], !isOn(t.id));
  if (t.dim) {
    const range = u.range = el("input", "lvl"); range.type = "range"; range.min = 1; range.max = 100; range.value = 50;
    range.setAttribute("aria-label", t.name + " brightness");
    let sendTimer = null, last = 0;
    const send = () => { last = Date.now(); if (call("light", "turn_on", { entity_id: t.id, brightness_pct: +range.value })) pending[t.id] = { on: true, until: Date.now() + 6000 }; };
    range.oninput = () => {
      ui.dragging = range; range.style.setProperty("--p", range.value + "%"); u.badge.textContent = range.value + "%";
      clearTimeout(sendTimer);
      sendTimer = setTimeout(send, Math.max(0, 350 - (Date.now() - last)));   // at most ~3 commands a second while dragging
    };
    range.onchange = () => { clearTimeout(sendTimer); send(); buzz(); setTimeout(() => { if (ui.dragging === range) ui.dragging = null; draw(); }, 2500); };
    tile.append(range);
  }
  if (t.colour) {
    const row = el("div", "swatches");
    for (const c of COLOURS) {
      if (c.gap) { row.append(el("span", "swgap")); continue; }
      const b = el("button", "sw"); b.style.setProperty("--c", c.css);
      b.setAttribute("aria-label", t.name + ": " + c.name); b.title = c.name; b.setAttribute("aria-pressed", "false");
      b.onclick = () => {
        buzz();

// Browsers (and Home Assistant's own offline cache) can keep showing an old copy of this page.
// This asks the server for the newest copy; if it is newer, the page is opened again under a
// fresh address (?v=...), which no cache can answer. It never does this in the middle of a sign-in.
// When you edit this file, change the VERSION text.
const VERSION = "1.0.0";
const pageQuery = new URLSearchParams(location.search);
if (!pageQuery.get("code")) {
  fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(t => {
    const m = t.match(/const VERSION = "([^"]+)"/);
    if (m && m[1] !== VERSION && pageQuery.get("v") !== m[1]) location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
  }).catch(() => {});
}

$("retryBtn").onclick = () => location.replace(location.pathname + "?r=" + Date.now());
